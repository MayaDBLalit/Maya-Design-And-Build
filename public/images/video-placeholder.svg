<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E232B" />
      <stop offset="60%" stop-color="#12151B" />
      <stop offset="100%" stop-color="#090B0E" />
    </radialGradient>

    <!-- Play Button Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A869" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C5A869" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gold Accents -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFCA94" />
      <stop offset="50%" stop-color="#C5A869" />
      <stop offset="100%" stop-color="#8F7234" />
    </linearGradient>

    <!-- Architectural Grid Pattern -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2B313D" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Architectural Drafting Grid Overlay -->
  <rect width="1280" height="720" fill="url(#archGrid)" />

  <!-- Vignette Border Frame -->
  <rect x="24" y="24" width="1232" height="672" fill="none" stroke="#2B313D" stroke-width="1" stroke-opacity="0.5" />
  <rect x="32" y="32" width="1216" height="656" fill="none" stroke="#C5A869" stroke-width="1" stroke-opacity="0.15" />

  <!-- Corner Brackets -->
  <path d="M 24 64 L 24 24 L 64 24" fill="none" stroke="#C5A869" stroke-width="2" />
  <path d="M 1256 64 L 1256 24 L 1216 24" fill="none" stroke="#C5A869" stroke-width="2" />
  <path d="M 24 656 L 24 696 L 64 696" fill="none" stroke="#C5A869" stroke-width="2" />
  <path d="M 1256 656 L 1256 696 L 1216 696" fill="none" stroke="#C5A869" stroke-width="2" />

  <!-- Top Badge: MAYA CINEMATIC -->
  <g transform="translate(60, 68)">
    <rect width="190" height="30" rx="4" fill="#14171C" stroke="#2B313D" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#C5A869" />
    <text x="30" y="19" fill="#C5A869" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">
      MAYA WALKTHROUGH
    </text>
  </g>

  <!-- Center Play Button with Aura -->
  <g transform="translate(640, 360)">
    <!-- Outer Glow Aura -->
    <circle cx="0" cy="0" r="110" fill="url(#goldGlow)" />

    <!-- Outer Circular Ring -->
    <circle cx="0" cy="0" r="64" fill="#14171C" stroke="url(#goldBorder)" stroke-width="2" />

    <!-- Inner Disc -->
    <circle cx="0" cy="0" r="54" fill="#0D0F12" stroke="#2B313D" stroke-width="1" />

    <!-- Play Icon Triangle (Offset slightly for visual centering) -->
    <polygon points="-8,-18 -8,18 20,0" fill="url(#goldBorder)" />
  </g>

  <!-- Bottom Helper Caption -->
  <text x="640" y="475" text-anchor="middle" fill="#E5E7EB" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="3">
    VIDEO WALKTHROUGH
  </text>
  <text x="640" y="502" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" letter-spacing="1">
    Click to stream full cinematic preview
  </text>
</svg>
